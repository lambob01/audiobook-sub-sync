services:
  syncspeak:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - HTTPS=${HTTPS:-false}
    volumes:
      - syncspeak-data:/app/data
    restart: unless-stopped

volumes:
  syncspeak-data:
